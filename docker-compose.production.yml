version: "3.8"

services:
  # ==================== DATABASE ====================
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: mentorbooking
      POSTGRES_USER: ${DB_USER:-mentorbooking}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mentorbooking}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==================== AUTH SERVICE ====================
  auth-service:
    build:
      context: .
      dockerfile: AuthService.Api/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=mentorbooking;Username=${DB_USER:-mentorbooking};Password=${DB_PASSWORD}"
      ConnectionStrings__auth-db: "Host=postgres;Port=5432;Database=mentorbooking;Username=${DB_USER:-mentorbooking};Password=${DB_PASSWORD}"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env.production}
      JwtSettings__Issuer: ${GATEWAY_URL:-http://localhost}
      JwtSettings__Audience: ${GATEWAY_URL:-http://localhost}
      RabbitMQ__Enabled: "false"
      Admin__DefaultEmail: ${ADMIN_EMAIL:-admin@mentorbooking.com}
      Admin__DefaultPassword: ${ADMIN_PASSWORD:-Admin@123}
      Firebase__CredentialJson: ${FIREBASE_CREDENTIAL_JSON:-}
      Firebase__BucketName: mentorbookingproject.firebasestorage.app

  # ==================== BOOKING SERVICE ====================
  booking-service:
    build:
      context: .
      dockerfile: BookingService.Api/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=mentorbooking;Username=${DB_USER:-mentorbooking};Password=${DB_PASSWORD}"
      ConnectionStrings__booking-db: "Host=postgres;Port=5432;Database=mentorbooking;Username=${DB_USER:-mentorbooking};Password=${DB_PASSWORD}"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: ${GATEWAY_URL:-http://localhost}
      JwtSettings__Audience: ${GATEWAY_URL:-http://localhost}
      RabbitMQ__Enabled: "false"
      ServiceUrls__AuthService: http://auth-service:8080
      Zoom__AccountId: ${ZOOM_ACCOUNT_ID:-}
      Zoom__ClientId: ${ZOOM_CLIENT_ID:-}
      Zoom__ClientSecret: ${ZOOM_CLIENT_SECRET:-}
      Firebase__BucketName: ${FIREBASE_BUCKET:-}
      Firebase__CredentialJson: ${FIREBASE_CREDENTIAL_JSON:-}
      Firebase__CredentialJsonBase64: ${FIREBASE_CREDENTIAL_JSON_BASE64:-}
      Firebase__CredentialPath: ${FIREBASE_CREDENTIAL_PATH:-}

  # ==================== MEETING SERVICE ====================
  meeting-service:
    build:
      context: .
      dockerfile: MeetingService.Api/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=mentorbooking;Username=${DB_USER:-mentorbooking};Password=${DB_PASSWORD}"
      ConnectionStrings__meeting-db: "Host=postgres;Port=5432;Database=mentorbooking;Username=${DB_USER:-mentorbooking};Password=${DB_PASSWORD}"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: ${GATEWAY_URL:-http://localhost}
      JwtSettings__Audience: ${GATEWAY_URL:-http://localhost}
      RabbitMQ__Enabled: "false"

  # ==================== AI SERVICE ====================
  ai-service:
    build:
      context: .
      dockerfile: AIService.Api/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ai-uploads:/tmp/uploads
      - ai-models:/tmp/models
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=mentorbooking;Username=${DB_USER:-mentorbooking};Password=${DB_PASSWORD}"
      ConnectionStrings__ai-db: "Host=postgres;Port=5432;Database=mentorbooking;Username=${DB_USER:-mentorbooking};Password=${DB_PASSWORD}"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: ${GATEWAY_URL:-http://localhost}
      JwtSettings__Audience: ${GATEWAY_URL:-http://localhost}
      RabbitMQ__Enabled: "false"
      Gemini__ApiKey: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env.production}
      Gemini__Model: gemini-2.5-flash
      Storage__BasePath: /tmp/uploads
      FFmpeg__BinaryFolder: /usr/bin
      Whisper__ModelPath: /tmp/models/ggml-base.bin
      Whisper__AutoDownloadIfMissing: "true"
      Whisper__ModelType: Base

  # ==================== EMAIL SERVICE ====================
  email-service:
    build:
      context: .
      dockerfile: EmailService.Api/Dockerfile
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: ${GATEWAY_URL:-http://localhost}
      JwtSettings__Audience: ${GATEWAY_URL:-http://localhost}
      RabbitMQ__Enabled: "false"
      Email__DisplayName: Mentor Booking Support
      Email__From: ${EMAIL_FROM:-}
      Email__Host: smtp.gmail.com
      Email__Port: "587"
      Email__Username: ${EMAIL_USERNAME:-}
      Email__Password: ${EMAIL_PASSWORD:-}

  # ==================== API GATEWAY ====================
  api-gateway:
    build:
      context: .
      dockerfile: MBP.ApiGateway/MBP.ApiGateway.ApiService/Dockerfile
    restart: always
    depends_on:
      - auth-service
      - booking-service
      - meeting-service
      - ai-service
      - email-service
    ports:
      - "80:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: ${GATEWAY_URL:-http://localhost}
      JwtSettings__Audience: ${GATEWAY_URL:-http://localhost}
      RabbitMQ__Enabled: "false"
      ReverseProxy__Clusters__auth-cluster__Destinations__destination1__Address: http://auth-service:8080
      ReverseProxy__Clusters__booking-cluster__Destinations__destination1__Address: http://booking-service:8080
      ReverseProxy__Clusters__meeting-cluster__Destinations__destination1__Address: http://meeting-service:8080
      ReverseProxy__Clusters__ai-cluster__Destinations__destination1__Address: http://ai-service:8080

volumes:
  pgdata:
  ai-uploads:
  ai-models:
