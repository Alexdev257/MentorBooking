databases:
  - name: mentorbooking-db
    plan: free
    databaseName: mentorbooking
    user: mentorbooking

envVarGroups:
  - name: shared-config
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "10000"
      - key: JwtSettings__SecretKey
        sync: false
      - key: JwtSettings__Issuer
        value: https://mentorbooking-gateway.onrender.com
      - key: JwtSettings__Audience
        value: https://mentorbooking-gateway.onrender.com
      - key: RabbitMQ__Enabled
        value: "false"

services:
  # ==================== AUTH SERVICE ====================
  - type: web
    name: auth-service
    runtime: docker
    plan: free
    dockerfilePath: ./AuthService.Api/Dockerfile
    dockerContext: .
    envVars:
      - fromGroup: shared-config
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: mentorbooking-db
          property: connectionString
      - key: Admin__DefaultEmail
        sync: false
      - key: Admin__DefaultPassword
        sync: false
      - key: Firebase__CredentialPath
        value: ""
      - key: Firebase__BucketName
        value: mentorbookingproject.firebasestorage.app

  # ==================== BOOKING SERVICE ====================
  - type: web
    name: booking-service
    runtime: docker
    plan: free
    dockerfilePath: ./BookingService.Api/Dockerfile
    dockerContext: .
    envVars:
      - fromGroup: shared-config
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: mentorbooking-db
          property: connectionString
      - key: ServiceUrls__AuthService
        fromService:
          name: auth-service
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: Zoom__AccountId
        sync: false
      - key: Zoom__ClientId
        sync: false
      - key: Zoom__ClientSecret
        sync: false

  # ==================== MEETING SERVICE ====================
  - type: web
    name: meeting-service
    runtime: docker
    plan: free
    dockerfilePath: ./MeetingService.Api/Dockerfile
    dockerContext: .
    envVars:
      - fromGroup: shared-config
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: mentorbooking-db
          property: connectionString

  # ==================== AI SERVICE ====================
  - type: web
    name: ai-service
    runtime: docker
    plan: free
    dockerfilePath: ./AIService.Api/Dockerfile
    dockerContext: .
    envVars:
      - fromGroup: shared-config
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: mentorbooking-db
          property: connectionString
      - key: Gemini__ApiKey
        sync: false
      - key: Gemini__Model
        value: gemini-2.5-flash-lite
      - key: Storage__BasePath
        value: /tmp/uploads

  # ==================== EMAIL SERVICE ====================
  - type: web
    name: email-service
    runtime: docker
    plan: free
    dockerfilePath: ./EmailService.Api/Dockerfile
    dockerContext: .
    envVars:
      - fromGroup: shared-config
      - key: Email__DisplayName
        value: Mentor Booking Support
      - key: Email__From
        sync: false
      - key: Email__Host
        value: smtp.gmail.com
      - key: Email__Port
        value: "587"
      - key: Email__Username
        sync: false
      - key: Email__Password
        sync: false

  # ==================== API GATEWAY ====================
  - type: web
    name: api-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./MBP.ApiGateway/MBP.ApiGateway.ApiService/Dockerfile
    dockerContext: .
    envVars:
      - fromGroup: shared-config
      - key: ReverseProxy__Clusters__auth-cluster__Destinations__destination1__Address
        fromService:
          name: auth-service
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ReverseProxy__Clusters__booking-cluster__Destinations__destination1__Address
        fromService:
          name: booking-service
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ReverseProxy__Clusters__meeting-cluster__Destinations__destination1__Address
        fromService:
          name: meeting-service
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ReverseProxy__Clusters__ai-cluster__Destinations__destination1__Address
        fromService:
          name: ai-service
          type: web
          envVarKey: RENDER_EXTERNAL_URL
